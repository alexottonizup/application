name: "PR Feature → Develop"

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release
        run: |
          npm install -g semantic-release @semantic-release/git @semantic-release/github

      - name: Get next version
        id: version
        run: |
          # Calcular próxima versão
          NEXT_VERSION=$(npx semantic-release --dry-run --no-ci | grep "next release version is" | awk '{print $NF}')
          
          if [ -z "$NEXT_VERSION" ]; then
            NEXT_VERSION="1.0.0"
          fi
          
          echo "version=${NEXT_VERSION}-SNAPSHOT" >> $GITHUB_OUTPUT
          echo "📦 Próxima versão: ${NEXT_VERSION}-SNAPSHOT"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          VERSION="${{ steps.version.outputs.version }}"
          
          # Verificar se PR já existe
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base develop --json number --jq '.[0].number')
          
          if [ -n "$EXISTING_PR" ]; then
            echo "✅ PR #$EXISTING_PR já existe"
            exit 0
          fi
          
          # Criar PR
          gh pr create \
            --base develop \
            --head "$BRANCH_NAME" \
            --title "develop ← $BRANCH_NAME" \
            --body "🚀 **Versão:** \`$VERSION\`

          **Branch:** \`$BRANCH_NAME\`
          **Target:** \`develop\`
          
          ---
          _PR criado automaticamente pelo workflow_"
          
          echo "✅ PR criado com sucesso!"