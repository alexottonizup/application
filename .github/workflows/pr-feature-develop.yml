name: PR feature → develop

on:
  push:
    branches:
      - 'feature/**'

jobs:
  pr-feature-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up GitHub CLI
        uses: cli/cli-action@v2

      - name: Fetch develop
        run: git fetch origin develop

      - name: Check for new commits
        id: check_commits
        run: |
          COMMITS=$(git log origin/develop..HEAD --oneline | wc -l)
          echo "commits=$COMMITS" >> $GITHUB_OUTPUT

      - name: Create PR to develop
        if: steps.check_commits.outputs.commits != '0'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh pr create \
            --base develop \
            --head ${{ github.ref_name }} \
            --title "feature/${{ github.ref_name }} → develop" \
            --body "PR automático da feature branch para develop."
