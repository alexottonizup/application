# PR Feature → Develop

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get next version
        id: version
        run: |
          # Descobre a última versão (ou começa em 1.0.0)
          if [ -f ".version" ]; then
            BASE_VERSION=$(cat .version | sed 's/-.*//')
          else
            BASE_VERSION="1.0.0"
          fi

          # Incrementa minor (exemplo simples, pode sofisticar)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          MINOR=$((MINOR+1))
          NEXT_VERSION="$MAJOR.$MINOR.0-SNAPSHOT"

          echo "$NEXT_VERSION" > .version
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Próxima versão: $NEXT_VERSION"

      - name: Commit .version
        run: |
          git add .version
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]" || echo "No changes"
          git push origin HEAD

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          VERSION="${{ steps.version.outputs.version }}"
          
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base develop --json number --jq '.[0].number')
          
          if [ -n "$EXISTING_PR" ]; then
            echo "✅ PR #$EXISTING_PR já existe"
            exit 0
          fi
          
          gh pr create \
            --base develop \
            --head "$BRANCH_NAME" \
            --title "develop ← $BRANCH_NAME" \
            --body "🚀 **Versão:** \`$VERSION\`  
          **Branch:** \`$BRANCH_NAME\`  
          **Target:** \`develop\`
          
          ---
          _PR criado automaticamente pelo workflow_"
          
          echo "✅ PR criado com sucesso!"
