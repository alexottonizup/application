name: PR feature → develop

on:
  push:
    branches:
      - 'feature/**'

jobs:
  pr-feature-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Fetch develop
        run: git fetch origin develop

      - name: Check for new commits
        id: check_commits
        run: |
          COMMITS=$(git log origin/develop..HEAD --oneline | wc -l)
          echo "commits=$COMMITS" >> $GITHUB_OUTPUT
          echo "📊 Commits novos: $COMMITS"

      - name: Create PR to develop
        if: steps.check_commits.outputs.commits != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FEATURE_NAME=$(echo "${{ github.ref_name }}" | sed 's/feature\///')
          
          # Verifica se já existe PR aberto
          EXISTING_PR=$(gh pr list --base develop --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base develop \
              --head "${{ github.ref_name }}" \
              --title "✨ feature/$FEATURE_NAME → develop" \
              --body "**PR automático da feature branch para develop**

          🌿 **Feature:** \`$FEATURE_NAME\`
          🔄 **Origem:** \`${{ github.ref_name }}\`
          🎯 **Destino:** \`develop\`
          📝 **Commits:** ${{ steps.check_commits.outputs.commits }}
          
          ---
          _Este PR foi criado automaticamente pelo GitHub Actions_"
            echo "✅ PR criado com sucesso!"
          else
            echo "⚠️ PR #$EXISTING_PR já existe"
          fi