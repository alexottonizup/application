on:
  push:
    branches:
      - 'release/**'

jobs:
  pr-release-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Get version from .version file
        id: version
        run: |
          VERSION=$(cat .version | sed 's/-RELEASE//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create PR to main
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          EXISTING_PR=$(gh pr list --base main --head "$BRANCH_NAME" --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "🚀 $BRANCH_NAME → main" \
              --body "**PR automático da branch de release para main** 📦 **Versão:** \`${{ steps.version.outputs.version }}\`"
            echo "✅ PR criado com sucesso!"
          else
            echo "⚠️ PR #$EXISTING_PR já existe"
          fi
