name: Version and PR (release → main)

on:
  push:
    branches:
      - release

permissions:
  contents: write
  pull-requests: write

jobs:
  version-and-pr:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --save-dev semantic-release @semantic-release/exec

      - name: Check if there are commits to merge
        id: check_commits
        run: |
          git fetch origin main
          git fetch origin release
          
          COMMITS=$(git log origin/main..origin/release --oneline 2>/dev/null | wc -l || echo "0")
          echo "commits=$COMMITS" >> $GITHUB_OUTPUT
          echo "📊 Commits entre release e main: $COMMITS"
          
          if [ "$COMMITS" -eq 0 ]; then
            echo "⚠️ Nenhum commit novo para criar PR"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Há commits para criar PR"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run semantic-release (dry-run)
        if: steps.check_commits.outputs.skip == 'false'
        run: npx semantic-release --dry-run > output.log 2>&1 || true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Extract version
        if: steps.check_commits.outputs.skip == 'false'
        id: version
        run: |
          VERSION=$(grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+' output.log | tail -1)
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Next version: $VERSION"

      - name: Create or Update Pull Request
        if: steps.check_commits.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          COMMITS="${{ steps.check_commits.outputs.commits }}"
          
          PR_NUMBER=$(gh pr list \
            --head release \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")
          
          if [ -z "$PR_NUMBER" ]; then
            echo "✨ Creating new PR..."
            gh pr create \
              --title "main ← release (v$VERSION)" \
              --body "## 🚀 PR criado automaticamente

**Versão:** \`$VERSION\`  
**Branch origem:** \`release\`  
**Branch destino:** \`main\` (Produção)  
**Commits:** $COMMITS  
**Criado em:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

---

### 📋 Descrição
Este PR entrega a versão de release para o ambiente de produção.

### ✅ Checklist de Produção
- [ ] Testes de homologação completos
- [ ] Aprovação do QA recebida
- [ ] Aprovação de change management
- [ ] Plano de rollback preparado
- [ ] Alertas de monitoramento configurados
- [ ] Documentação atualizada" \
              --base main \
              --head release
            echo "✅ PR criado com sucesso!"
          else
            echo "🔄 PR #$PR_NUMBER já existe, atualizando..."
            gh pr edit "$PR_NUMBER" \
              --title "main ← release (v$VERSION)"
            echo "✅ PR atualizado com sucesso!"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Skip PR creation (no commits)
        if: steps.check_commits.outputs.skip == 'true'
        run: |
          echo "⚠️ Nenhum commit novo entre release e main"
          echo "ℹ️ PR não será criado pois as branches estão sincronizadas"