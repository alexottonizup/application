name: PR release → main

on:
  push:
    branches:
      - 'release/**'

jobs:
  pr-release-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get version from .version file
        id: version
        run: |
          VERSION=$(cat .version | sed 's/-RELEASE//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versão: $VERSION"

      - name: Create PR to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --base main --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "🚀 ${{ github.ref_name }} → main" \
              --body "**PR automático da branch de release para main**

📦 **Versão:** \`${{ steps.version.outputs.version }}\`
🔄 **Origem:** \`${{ github.ref_name }}\`
🎯 **Destino:** \`main\`

⚠️ **Importante:** Após o merge, será criada automaticamente:
- Tag \`v${{ steps.version.outputs.version }}\`
- GitHub Release

---
_Este PR foi criado automaticamente pelo GitHub Actions_"
            echo "✅ PR criado com sucesso!"
          else
            echo "⚠️ PR #$EXISTING_PR já existe"
          fi