name: Create Tag on Main

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install -g semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github

      - name: Run Semantic Release (Dry Run)
        id: semantic
        run: |
          npx semantic-release --dry-run > output.log 2>&1 || true
          
          # Extrair versão
          VERSION=$(grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' output.log || echo "")
          
          if [ -z "$VERSION" ]; then
            echo "⚠️ Nenhuma nova versão para publicar"
            echo "version=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "✅ Nova versão detectada: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          GB_TOKEN: ${{ secrets.GB_TOKEN }}

      - name: Check if tag exists
        id: check_tag
        if: steps.semantic.outputs.version != ''
        run: |
          VERSION="${{ steps.semantic.outputs.version }}"
          TAG_NAME="v$VERSION"
          
          # Atualizar tags remotas
          git fetch --tags
          
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "⚠️ Tag $TAG_NAME já existe"
            echo "exists=true" >> $GITHUB_OUTPUT
            
            # Verificar se release existe
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              echo "release_exists=true" >> $GITHUB_OUTPUT
            else
              echo "release_exists=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "✅ Tag $TAG_NAME não existe"
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "release_exists=false" >> $GITHUB_OUTPUT
          fi
          
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GB_TOKEN }}

      - name: Create Git Tag
        if: |
          steps.semantic.outputs.version != '' && 
          steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.semantic.outputs.version }}"
          TAG_NAME="v$VERSION"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a "$TAG_NAME" -m "Release $VERSION"
          git push origin "$TAG_NAME"
          
          echo "✅ Tag $TAG_NAME criada e enviada"

      - name: Create GitHub Release
        if: |
          steps.semantic.outputs.version != '' && 
          steps.check_tag.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GB_TOKEN }}
        run: |
          VERSION="${{ steps.semantic.outputs.version }}"
          TAG_NAME="v$VERSION"
          
          # Gerar changelog
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD)
          
          gh release create "$TAG_NAME" \
            --title "Release $VERSION" \
            --notes "## 🚀 Mudanças

$CHANGELOG

---
📦 Versão: \`$VERSION\`
🏷️ Tag: \`$TAG_NAME\`
📅 Data: $(date '+%Y-%m-%d %H:%M:%S')" \
            --target main \
            --latest
          
          echo "✅ Release $TAG_NAME criada"

      - name: Find Merged PR
        id: find_pr
        if: steps.semantic.outputs.version != ''
        run: |
          PR_NUMBER=$(gh pr list \
            --state merged \
            --base main \
            --limit 1 \
            --json number \
            --jq '.[0].number')
          
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GB_TOKEN }}

      - name: Comment on PR
        if: |
          steps.semantic.outputs.version != '' && 
          steps.find_pr.outputs.pr_number != '' &&
          steps.find_pr.outputs.pr_number != 'null'
        run: |
          VERSION="${{ steps.semantic.outputs.version }}"
          TAG_NAME="v$VERSION"
          PR_NUMBER="${{ steps.find_pr.outputs.pr_number }}"
          
          STATUS="criada"
          if [ "${{ steps.check_tag.outputs.exists }}" = "true" ]; then
            STATUS="atualizada"
          fi
          
          gh pr comment "$PR_NUMBER" --body "🎉 **Release $STATUS com sucesso!**

📦 **Versão:** \`$VERSION\`
🏷️ **Tag:** \`$TAG_NAME\`
🔗 **Release:** https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME

✅ A versão foi publicada em produção." || \
          echo "⚠️ Não foi possível comentar no PR #$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "## 📊 Resumo da Execução" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ steps.semantic.outputs.version }}" ]; then
            echo "✅ **Versão:** ${{ steps.semantic.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Tag:** v${{ steps.semantic.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ steps.check_tag.outputs.exists }}" = "true" ]; then
              echo "⚠️ **Status:** Tag já existia" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ **Status:** Nova tag criada" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "ℹ️ **Status:** Nenhuma nova versão para publicar" >> $GITHUB_STEP_SUMMARY
          fi
