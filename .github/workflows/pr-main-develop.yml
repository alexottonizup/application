name: PR Main → Develop after Hotfix
on:
  push:
    branches:
      - main
jobs:
  pr-main-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Create PR Main → Develop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base develop \
              --head main \
              --title "develop ← main (hotfix sync)" \
              --body "🔄 Sincronização automática após hotfix"
            echo "✅ PR criado com sucesso!"
          else
            echo "⚠️ PR #$EXISTING_PR já existe"
          fi
