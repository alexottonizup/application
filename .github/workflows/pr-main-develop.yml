name: "PR Main → Develop after Hotfix"

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  pr-main-develop:
    runs-on: ubuntu-latest
    # ✅ Só executa se:
    # 1. PR foi mergeado
    # 2. Branch de origem é hotfix/*
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'hotfix/')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Check if develop is behind main
        id: diff
        run: |
          git fetch origin develop
          if git diff --quiet origin/main origin/develop; then
            echo "no_diff=true" >> $GITHUB_OUTPUT
          else
            echo "no_diff=false" >> $GITHUB_OUTPUT
          fi

      - name: Create PR Main → Develop
        if: steps.diff.outputs.no_diff == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number')
          
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base develop \
              --head main \
              --title "develop ← main (hotfix sync)" \
              --body "🔄 Sincronização automática após hotfix \`${{ github.event.pull_request.head.ref }}\`"
            echo "✅ PR criado com sucesso!"
          else
            echo "⚠️ PR #$EXISTING_PR já existe"
          fi
