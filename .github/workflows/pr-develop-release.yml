name: "PR Develop → Release"

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get next release version and update .version
        id: version
        run: |
          if [ -f ".version" ]; then
            BASE_VERSION=$(cat .version | sed 's/-.*//')
          else
            BASE_VERSION="1.0.0"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          # Mantém a versão, só troca o sufixo para RELEASE
          RELEASE_VERSION="$MAJOR.$MINOR.$PATCH-RELEASE"

          echo "$RELEASE_VERSION" > .version
          echo "version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

      - name: Create Release Branch and commit .version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_BRANCH="release/$VERSION"
          
          git checkout -b "$RELEASE_BRANCH"
          
          git add .version
          git commit -m "chore: bump version to $VERSION [skip ci]" || echo "No changes"
          
          git push origin "$RELEASE_BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_BRANCH="release/$VERSION"
          
          EXISTING_PR=$(gh pr list --head "$RELEASE_BRANCH" --base main --json number --jq '.[0].number')
          
          if [ -n "$EXISTING_PR" ]; then
            echo "✅ PR #$EXISTING_PR já existe"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "🚀 Release $VERSION" \
            --body "## 🚀 Release $VERSION - PR criado automaticamente pelo workflow"
          
          echo "✅ PR criado com sucesso!"
