name: Version and PR (develop → release)

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-branch:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'feature/')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout develop
        uses: actions/checkout@v3
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --save-dev semantic-release @semantic-release/exec

      - name: Get version from develop
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -f "package.json" ]; then
            VERSION=$(node -p "require('./package.json').version" | sed 's/-SNAPSHOT//')
            echo "📦 Version from package.json: $VERSION"
          else
            npx semantic-release --dry-run > output.log 2>&1 || true
            VERSION=$(grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' output.log | tail -1)
            if [ -z "$VERSION" ]; then
              LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
              VERSION=$(echo "$LAST_TAG" | sed 's/v//')
              echo "⚠️ Using version from last tag: $VERSION"
            fi
          fi
          
          RELEASE_VERSION="${VERSION}-RELEASE"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Next RELEASE version: $RELEASE_VERSION"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create versioned release branch
        id: release_branch
        run: |
          VERSION="${{ steps.semantic.outputs.version }}"
          RELEASE_BRANCH="release/${VERSION}-RELEASE"
          
          git fetch origin
          if git ls-remote --heads origin "$RELEASE_BRANCH" | grep -q "$RELEASE_BRANCH"; then
            echo "✅ Branch $RELEASE_BRANCH já existe"
            git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
            git merge origin/develop --no-edit
          else
            echo "🆕 Criando branch $RELEASE_BRANCH a partir de develop"
            git checkout -b "$RELEASE_BRANCH" origin/develop
          fi
          
          RELEASE_VERSION="${{ steps.semantic.outputs.release_version }}"
          if [ -f "package.json" ]; then
            npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
            git add package.json
            git commit -m "chore: bump version to $RELEASE_VERSION [skip ci]" || echo "No changes"
          fi
          
          git push origin "$RELEASE_BRANCH"
          echo "branch=$RELEASE_BRANCH" >> $GITHUB_OUTPUT

      - name: Create Pull Request to main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION="${{ steps.semantic.outputs.version }}"
          RELEASE_BRANCH="${{ steps.release_branch.outputs.branch }}"
          
          PR_NUMBER=$(gh pr list \
            --head "$RELEASE_BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")
          
          if [ -z "$PR_NUMBER" ]; then
            echo "✨ Criando novo PR..."
            gh pr create \
              --title "main ← ${RELEASE_BRANCH}" \
              --body "## 🚀 PR criado automaticamente

**Versão:** \`${VERSION}-RELEASE\`" \
              --base main \
              --head "$RELEASE_BRANCH" \
              --repo ${{ github.repository }}
          else
            echo "🔄 PR #$PR_NUMBER já existe"
          fi