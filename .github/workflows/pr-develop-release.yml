name: PR develop → release

on:
  push:
    branches:
      - develop

jobs:
  pr-develop-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get next version
        id: version
        run: |
          # Pega versão do package.json e incrementa patch
          CURRENT_VERSION=$(jq -r .version package.json | sed 's/-SNAPSHOT//')
          VERSION=$(echo "$CURRENT_VERSION" | awk -F. '{$NF+=1; OFS="."; print $0}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Próxima versão: $VERSION"

      - name: Create release branch if not exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="release/${{ steps.version.outputs.version }}-RELEASE"
          
          if ! git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "✨ Criando branch $BRANCH"
            git checkout -b "$BRANCH"
            
            # Atualiza versão no package.json (remove -SNAPSHOT)
            jq --arg version "${{ steps.version.outputs.version }}-RELEASE" '.version = $version' package.json > tmp.json
            mv tmp.json package.json
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "chore: bump version to ${{ steps.version.outputs.version }}-RELEASE [skip ci]"
            git push origin "$BRANCH"
          else
            echo "⚠️ Branch $BRANCH já existe"
          fi

      - name: Create PR to release branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="release/${{ steps.version.outputs.version }}-RELEASE"
          
          # Verifica se já existe PR aberto
          EXISTING_PR=$(gh pr list --base "$BRANCH" --head develop --state open --json number --jq '.[0].number')
          
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base "$BRANCH" \
              --head develop \
              --title "🚀 develop → $BRANCH" \
              --body "**PR automático de develop para branch de release**

          📦 **Versão:** \`${{ steps.version.outputs.version }}-RELEASE\`
          🔄 **Origem:** \`develop\`
          🎯 **Destino:** \`$BRANCH\`
          
          ---
          _Este PR foi criado automaticamente pelo GitHub Actions_"
            echo "✅ PR criado com sucesso!"
          else
            echo "⚠️ PR #$EXISTING_PR já existe"
          fi