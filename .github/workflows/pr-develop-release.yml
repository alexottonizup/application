name: "PR Develop → Release"

on:
  push:
    branches:
      - develop
    # APENAS develop!

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release
        run: |
          npm install -g semantic-release @semantic-release/git @semantic-release/github

      - name: Get next version
        id: version
        run: |
          NEXT_VERSION=$(npx semantic-release --dry-run --no-ci | grep "next release version is" | awk '{print $NF}')
          
          if [ -z "$NEXT_VERSION" ]; then
            NEXT_VERSION="1.0.0"
          fi
          
          echo "version=${NEXT_VERSION}-RELEASE" >> $GITHUB_OUTPUT
          echo "📦 Versão Release: ${NEXT_VERSION}-RELEASE"

      - name: Create Release Branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_BRANCH="release/$VERSION"
          
          # Criar branch release
          git checkout -b "$RELEASE_BRANCH"
          
          # Atualizar package.json se existir
          if [ -f "package.json" ]; then
            npm version "$VERSION" --no-git-tag-version
            git add package.json
            git commit -m "chore: bump version to $VERSION"
          fi
          
          git push origin "$RELEASE_BRANCH"
          
          # Criar PR para main
          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "main ← $RELEASE_BRANCH" \
            --body "🚀 **Versão:** \`$VERSION\`

          **Branch:** \`$RELEASE_BRANCH\`
          **Target:** \`main\`
          
          ---
          _PR criado automaticamente pelo workflow_"