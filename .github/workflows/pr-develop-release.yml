name: PR develop → release

on:
  push:
    branches:
      - develop

jobs:
  pr-develop-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up GitHub CLI
        uses: cli/cli-action@v2

      - name: Get next version
        id: version
        run: |
          # Exemplo: pega versão do package.json ou incrementa patch
          VERSION=$(jq -r .version package.json | awk -F. '{$NF+=1; OFS="."; print $0}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release branch if not exists
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          BRANCH="release/${{ steps.version.outputs.version }}-RELEASE"
          if ! git ls-remote --exit-code --heads origin "$BRANCH"; then
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
          fi

      - name: Create PR to release branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          BRANCH="release/${{ steps.version.outputs.version }}-RELEASE"
          gh pr create \
            --base "$BRANCH" \
            --head develop \
            --title "develop → $BRANCH" \
            --body "PR automático de develop para branch de release."
