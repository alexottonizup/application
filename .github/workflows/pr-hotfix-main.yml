name: "PR Hotfix → Main"

on:
  push:
    branches:
      - 'hotfix/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Analyze commits and bump patch version
        id: version
        run: |
          # Pega a versão atual da main
          git fetch origin main
          git checkout origin/main -- .version 2>/dev/null || echo "1.0.0" > .version
          
          BASE_VERSION=$(cat .version | sed 's/-.*//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          
          # Hotfix sempre incrementa PATCH
          PATCH=$((PATCH+1))
          HOTFIX_VERSION="$MAJOR.$MINOR.$PATCH-HOTFIX"
          
          echo "$HOTFIX_VERSION" > .version
          echo "version=$HOTFIX_VERSION" >> $GITHUB_OUTPUT
          echo "🚑 Hotfix version: $HOTFIX_VERSION"

      - name: Commit .version
        run: |
          git checkout "${GITHUB_REF#refs/heads/}"
          git add .version
          git commit -m "chore: bump hotfix version to ${{ steps.version.outputs.version }} [skip ci]" || echo "No changes"
          git push origin HEAD

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          VERSION="${{ steps.version.outputs.version }}"
          
          EXISTING_PR=$(gh pr list --base main --head "$BRANCH_NAME" --state open --json number --jq '.[0].number')
          
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "🚑 Hotfix: $BRANCH_NAME → main" \
              --body "## 🚑 Hotfix Urgente
              
          **Versão:** \`$VERSION\`  
          **Branch:** \`$BRANCH_NAME\`  
          **Target:** \`main\`
          
          ---
          _Hotfix automático - requer aprovação urgente_"
            echo "✅ PR criado com sucesso!"
          else
            echo "⚠️ PR #$EXISTING_PR já existe"
          fi
