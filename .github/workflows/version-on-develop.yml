name: Create SNAPSHOT Version on Develop

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  create-snapshot-version:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'feature/')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout develop
        uses: actions/checkout@v3
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get next SNAPSHOT version and update .version
        id: version
        run: |
          if [ -f ".version" ]; then
            BASE_VERSION=$(cat .version | sed 's/-.*//')
          else
            BASE_VERSION="1.0.0"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          MINOR=$((MINOR+1))
          NEXT_VERSION="$MAJOR.$MINOR.0-SNAPSHOT"

          echo "$NEXT_VERSION" > .version
          echo "snapshot_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Next SNAPSHOT version: $NEXT_VERSION"

      - name: Commit .version to develop
        run: |
          git add .version
          git commit -m "chore: bump version to ${{ steps.version.outputs.snapshot_version }} [skip ci]" || echo "No changes"
          git push origin develop

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          SNAPSHOT_VERSION="${{ steps.version.outputs.snapshot_version }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          gh pr comment "$PR_NUMBER" --body "✅ **Versão SNAPSHOT criada:** \`$SNAPSHOT_VERSION\`"
