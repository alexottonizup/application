name: Auto Version on develop

on:
  push:
    branches:
      - develop

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: current
        run: |
          CURRENT=$(cat .version | sed 's/-SNAPSHOT//')
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "📦 Versão atual: $CURRENT"

      - name: Increment version
        id: next
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          NEXT=$(echo "$CURRENT" | awk -F. '{$NF+=1; OFS="."; print $0}')
          echo "version=$NEXT" >> $GITHUB_OUTPUT
          echo "🚀 Próxima versão: $NEXT"

      - name: Update .version file
        run: |
          echo "${{ steps.next.outputs.version }}-SNAPSHOT" > .version
          cat .version

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .version
          git commit -m "chore: bump version to ${{ steps.next.outputs.version }}-SNAPSHOT [skip ci]" || echo "Nada para commitar"
          git push